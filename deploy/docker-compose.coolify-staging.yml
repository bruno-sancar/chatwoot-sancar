# Stella Staging — Coolify Service deploy
# Repo: sancar-space/chatwoot  Branch: develop
# Compose file path: deploy/docker-compose.coolify-staging.yml
#
# Como usar no Coolify:
#   New Project → "Stella Staging"
#   New Resource → Service → Docker Compose → Public GitHub
#   Repository: sancar-space/chatwoot   Branch: develop
#   Compose path: deploy/docker-compose.coolify-staging.yml
#
# Após criar o serviço, configure os domínios no Coolify:
#   rails      → chat.stella.sancar.space      (port 3000)
#   n8n        → n8n-stella.sancar.space        (port 5678)  [opcional]
#   evolution  → evolution-stella.sancar.space  (port 8080)
#
# Variáveis obrigatórias a preencher no Coolify (todas as outras têm default):
#   FRONTEND_URL, EVOLUTION_URL, N8N_HOST
#   SECRET_KEY_BASE (min 128 chars), POSTGRES_PASSWORD, REDIS_PASSWORD
#   N8N_ENCRYPTION_KEY, EVOLUTION_API_KEY
#   RESEND_API_KEY (opcional — para envio de e-mail)

services:
  rails:
    image: chatwoot/chatwoot:v4.19.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_storage:/app/storage
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DEFAULT_LOCALE=pt_BR
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-chatwoot}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-stella@sancar.space}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SMTP_ADDRESS=${SMTP_ADDRESS:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
    entrypoint: docker/entrypoints/rails.sh
    command:
      - sh
      - '-c'
      - 'bundle exec rails db:chatwoot_prepare && exec bundle exec rails s -p 3000 -b 0.0.0.0'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- --header="Accept: text/html" http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  sidekiq:
    image: chatwoot/chatwoot:v4.19.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_storage:/app/storage
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - DEFAULT_LOCALE=pt_BR
      - FRONTEND_URL=${FRONTEND_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-chatwoot}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - MAILER_SENDER_EMAIL=${MAILER_SENDER_EMAIL:-stella@sancar.space}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    healthcheck:
      test: ['CMD-SHELL', 'ps aux | grep [s]idekiq']
      interval: 20s
      timeout: 10s
      retries: 5

  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_data:/evolution/instances
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_URL}
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${EVOLUTION_DB_NAME:-evolution}
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_client
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379/6
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_LOCAL_ENABLED=false
      - LOG_LEVEL=ERROR
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - WEBHOOK_GLOBAL_ENABLED=false
      - CONFIG_SESSION_PHONE_CLIENT=Stella
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - CHATWOOT_ENABLED=true
      - CHATWOOT_HOST=${FRONTEND_URL}

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USERNAME:-postgres}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - EXECUTIONS_PROCESS=main
      - GENERIC_TIMEZONE=America/Sao_Paulo

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-chatwoot}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chatwoot_storage:
  postgres_data:
  redis_data:
  evolution_data:
  n8n_data:
